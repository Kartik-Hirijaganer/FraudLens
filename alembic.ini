# Alembic configuration for FraudLens (plan §9.3). The migration env (alembic/env.py)
# resolves the database URL at runtime from DATABASE_URL / FRAUDLENS_DATABASE_URL (or a
# `sqlalchemy.url` set programmatically by tests), so NO connection string lives here.
# `make db-migrate` runs `alembic upgrade head`; migrations are expand/contract and
# hand-reviewed (never blindly autogenerated into history).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Resolved by env.py from the environment; intentionally blank (no secrets in the repo).
sqlalchemy.url =

# Logging — required by alembic's fileConfig. Kept minimal and quiet by default.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
