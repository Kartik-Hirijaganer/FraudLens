# gitleaks config — primary repo-wide secret scanner (rule 4 / Golden Rule 2).
# Extends the bundled ruleset and allowlists known non-secrets (lockfile hashes,
# the personal GitHub noreply email, and synthetic test/agency placeholders).
title = "FraudLens gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Repo-wide allowlist for lockfiles and synthetic values"
paths = [
  '''package-lock\.json''',
  '''uv\.lock''',
  '''.*\.terraform\.lock\.hcl''',
  # Gitignored runtime/download/dependency scratch; never source or a deploy input.
  '''\.local/''',
]
regexes = [
  # Personal GitHub noreply email used for commits (documented in AGENTS.md).
  '''65550498\+Kartik-Hirijaganer@users\.noreply\.github\.com''',
  # Obvious synthetic placeholders used in docs/tests/config.
  '''(?i)(changeme|example\.com|dev-agency|acme|<[^>]+>|\$\{[^}]+\})''',
  # Public Hugging Face git revisions pinned by config/vllm-bench.yaml.
  '''(?:a09a35458c702b33eeacc393d103063234e8bc28|b25037543e9394b818fdfca67ab2a00ecc7dd641)''',
  # Non-secret benchmark host selector emitted as the report's `hostKey` value.
  '''runpod-rtx4090''',
  # Uppercase env-var NAMES for the runtime-injected per-connection keys the SAR cascade routes
  # through. `ProviderConfig`/`ConnectionConfig` validate that these fields name an environment
  # variable (^[A-Z][A-Z0-9_]*$) and reject anything carrying a value, so the name is not a secret.
  '''\b[A-Z][A-Z0-9_]*_API_KEY\b''',
]
