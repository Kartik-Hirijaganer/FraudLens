# fraudlens-llm — standalone, catalog-driven async LLM client + security guardrails.
#
# Depends on NOTHING internal (generic + reusable across services). Layering is
# enforced structurally by the ruff banned-api block below: this package must not
# import fraudlens-backend, fraudlens-core, or fraudlens-ml.
#
# Provider SDKs (openai, anthropic) are isolated to THIS member so other packages
# stay lean unless they explicitly depend on fraudlens-llm.

[project]
name = "fraudlens-llm"
version = "1.0.0"
description = "FraudLens catalog-driven async LLM client with built-in security guardrails."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kartik Hirijaganer" }]
dependencies = [
    "openai>=1.40",
    "anthropic>=0.39",
    "jsonschema>=4.23",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudlens_llm"]

# Inherit the shared ruff baseline, then add package-specific layering bans.
[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fraudlens_backend" = { msg = "Layering: fraudlens-llm must not import fraudlens-backend." }
"fraudlens_core" = { msg = "Layering: fraudlens-llm is standalone; must not import fraudlens-core." }
"fraudlens_ml" = { msg = "Layering: fraudlens-llm must not import fraudlens-ml." }
