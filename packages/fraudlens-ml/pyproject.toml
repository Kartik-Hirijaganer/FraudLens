# fraudlens-ml — heavy ML dependencies are isolated to THIS member.
# Placeholder for now (XGBoost/SHAP/RAG features land in later plans). Layering:
# may import fraudlens-core, never fraudlens-backend (ruff banned-api below).
#
# When ML features land, heavy deps (xgboost, shap, scikit-learn, langchain,
# chromadb, ...) are added to [project.dependencies] HERE — never in backend or
# core — so the backend image stays lean unless it explicitly opts in.

[project]
name = "fraudlens-ml"
version = "0.1.0"
description = "FraudLens ML scoring + RAG (placeholder; heavy deps isolated here)."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kartik Hirijaganer" }]
dependencies = ["fraudlens-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudlens_ml"]

[tool.uv.sources]
fraudlens-core = { workspace = true }

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fraudlens_backend" = { msg = "Layering: fraudlens-ml must not import fraudlens-backend." }
