# FraudLens — the portfolio demo STORY (non-secret).
#
# The single source of every demo-specific value: the one runtime agency, its login personas,
# the pinned scoring model, the authored case pack, and the distribution a real pipeline run
# must reproduce. Loaded and validated by
# `backend/src/fraudlens_backend/portfolio_demo/config.py` (frozen Pydantic, extra="forbid");
# the filename comes from `portfolio_demo_config_file` in the layered app config.
#
# SECRETS NEVER LIVE HERE (Golden Rule 2). The demo password is deliberately public synthetic
# data, yet it is still supplied through env/Infisical via the `*_env` pointer below so
# `make secrets-scan` stays strict and no credential value is ever committed.
#
# Nothing here is written directly into `transactions.risk_band`, `alerts`, or `sar_drafts`:
# `expected` is ASSERTED against what the real rules -> model -> blend -> alert -> SAR pipeline
# produces, and a mismatch fails rather than adapts.
schema_version: 1

# Story revision. Every derived transaction external id, the Postgres advisory-lock key, and
# the bootstrap's audit request id are built from `external_id_namespace` + this value, so a
# bump re-keys the whole story at once.
story_version: v1
external_id_namespace: PORTFOLIO-DEMO

# Every scenario's `occurred_offset_hours` is relative to this instant, so re-runs place the
# story identically instead of drifting with wall-clock time.
story_anchor: 2026-07-01T09:00:00Z

# --- The single persistent runtime tenant -------------------------------------------------
# Exactly one demo agency exists at runtime. `research_partition_key` names the OFFLINE study
# partition this tenant mirrors in the committed GFP tenant-isolation artifact; research
# partitions are an analysis concept, never additional runtime tenants.
agency:
  id: 11111111-1111-4111-8111-111111111111
  name: Demo Financial Agency
  slug: demo-agency
  research_partition_key: Demo Financial Agency

# --- Login personas ------------------------------------------------------------------------
# `seed_user_id` is the fixed `users.id` the seed creates and every audited action is recorded
# under. `picker_*` is presentation only; `picker_accent` selects from the semantic accent set
# the frontend code owns, so DESIGN.md's palette rules cannot be violated from here.
personas:
  - key: analyst
    seed_user_id: 22222222-2222-4222-8222-222222222222
    email: analyst@demo-agency.test
    display_name: Alex Rivera
    initials: AR
    role: analyst
    picker_name: Fraud Analyst
    picker_tag: Queue
    picker_accent: green
  - key: reviewer
    seed_user_id: 33333333-3333-4333-8333-333333333333
    email: reviewer@demo-agency.test
    display_name: Morgan Diaz
    initials: MD
    role: reviewer
    picker_name: Reviewer
    picker_tag: Approve
    picker_accent: cyan
  - key: admin
    seed_user_id: 44444444-4444-4444-8444-444444444444
    email: admin@demo-agency.test
    display_name: Priya Shah
    initials: PS
    role: admin
    picker_name: Compliance Admin
    picker_tag: Model
    picker_accent: amber
  - key: auditor
