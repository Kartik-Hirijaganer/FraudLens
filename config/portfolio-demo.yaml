# Persona the non-prod dev bypass mints when no role is requested and no persona carries the
# configured `auth_dev_bypass_role`. Admin keeps the model lifecycle drivable locally.
default_bypass_persona: admin

# --- Public synthetic credential (pointer only) --------------------------------------------
auth:
  public_synthetic_password_env: FRAUDLENS_DEMO_AUTH_PASSWORD

# --- Pinned scoring model -------------------------------------------------------------------
# The only committed bundle carrying a `manifest.json` sidecar AND `gates_passed == 1.0`, so
# `make activate-model` already promotes it. Its non-null `risk_thresholds` switch the blend
# onto the operating-point map. Changing either value requires re-calibrating the case pack.
model:
  version_label: xgb-ibm-aml-fs2-9d43c5f92a
  feature_spec_version: 2

# Provider modes the expected distribution assumes (deterministic, keyless).
execution:
  llm_mode: mock
  rag_embedding_mode: offline
  multi_agent_sar_enabled: true
  mock_agent_revision_scenario: ring-payout-hop-3

# --- Case-pack partitioning -------------------------------------------------------------
# The demo ingests into ONE tenant, so the anchor-selection cycle is a single partition. The
# offline GFP study keeps its own three-partition default in `scripts/lib/aml_fraud.py`, so
# this value never moves the committed study artifact.
case_pack_partition_count: 1
case_pack_tenant_weights: [0]

# --- Workflow actors and synthetic review text ---------------------------------------------
# Values are persona KEYS; their roles are validated against the RBAC policy at load, and RBAC
# itself is never configurable from here.
workflow:
  assignment_actor: reviewer
  resolution_actor: reviewer
  sar_review_actor: reviewer
  assignee: analyst
  resolution_note: Synthetic demo note - cluster reviewed and closed after analyst write-up.
  approval_note: Synthetic demo note - narrative and citations accepted for filing.
  rejection_note: Synthetic demo note - insufficient corroboration, returned to the analyst.

# --- Calibration reporting -------------------------------------------------------------
# `low_confidence_margin` is cross-checked at load against `review_low_confidence_margin`, so
# the probe report and the runtime review gate can never drift apart.
probe:
  low_confidence_margin: 0.1
  report_top_n: 5

# --- The pinned distribution ---------------------------------------------------------------
# Asserted against real pipeline output. Every count is the algebraic consequence of
# `scenarios` below and is validated as such at load.
expected:
  transactions: 20
  unscored: 5
  risk_bands:
    low: 6
    medium: 4
    high: 3
    critical: 2
  alert_states:
    open: 3
    in_review: 1
    resolved: 1
  sar_states:
    draft: 2
    approved: 1
    rejected: 2

# --- The authored case pack -----------------------------------------------------------------
# Authored payloads calibrated against the live seeded `aml_rules.params` and the pinned model
# (`make portfolio-demo-probe`), then pinned by hand together with the `expected` block above.
# `expected_risk_band` / `expected_triggered_rules` are ASSERTIONS: a re-tuned rule param or a
# different model makes the bootstrap fail loudly instead of quietly telling a different story.
#
# Calibration notes (why the payloads look the way they do):
#   * The suspicious cluster settles over ACH because that is where the pinned bundle's signal
#     lives — it was trained on the IBM AML case pack, whose laundering rows are ACH-heavy
#     (`scripts/lib/aml_mapping.py` maps `Payment Format` -> channel). Authoring wire-only
#     "suspicious" rows would look plausible to a human and score near zero, which is exactly
#     the drift `expected_triggered_rules` exists to prevent.
#   * The same fact is why two ORDINARY ACH rows (payroll, consulting) settle at MEDIUM while
#     larger card/wire rows settle at LOW. That is the pinned model's real opinion, not a
#     mislabelled row: it reads mid-size ACH as the risky shape and large wires as routine.
#     Recording it here keeps a reader from "fixing" a correct expectation.
#   * CRITICAL requires rule corroboration by design (the critical band bound exceeds the blend
#     weight), so the two critical rows sit late in a structuring cluster where structuring,
#     threshold evasion, round amount, rapid movement, and velocity all fire.
#   * Every history a scored row needs is another row in this same list: history is windowed on
#     the MASKED account and `occurred_at < before`, so the early cluster members double as the
#     low/medium fillers that make the later ones fire.
#   * Accounts are obviously synthetic and differ in their last four characters, because
#     persistence masks them to that suffix and history groups on the masked value.
#   * The five `score: false` rows sit closest to the anchor, after every scored row, so a
#     visitor investigating one live cannot change any pinned expectation.
#   * Band margins observed at pinning time (band bounds: medium 0.30, high 0.60, critical 0.85).
#     These are a MAINTENANCE NOTE, not a contract — the contract is
#     `tests/integration/test_portfolio_demo_calibration.py`, which re-derives every band from
#     the live policy and the pinned bundle. Two rows sit close to a boundary and will be the
#     first to move if the blend weight, band bounds, or rule weights are retuned:
#       - ring-payout-hop-2  high      combined 0.8235  (0.0265 below the critical bound)
#       - ring-payout-hop-5  critical  combined 0.8744  (0.0244 above the critical bound)
#     Everything else clears its nearest boundary by more than 0.05. A retune that flips either
#     row is meant to fail the calibration test, not to be absorbed by widening the story.
scenarios:
  # --- Ordinary business activity (the quiet baseline the ring hides in) --------------------
  - scenario_id: retail-card-purchase
    external_id_suffix: TXN-001
    score: true
    expected_risk_band: low
    expected_triggered_rules: []
    transaction:
      amount: 250.75
      currency: USD
      origin_account: DEMO-SYNTH-ACCT-5001
      dest_account: DEMO-SYNTH-ACCT-9001
      channel: card
      country: US
      occurred_offset_hours: -70

