file_length:
  max_lines: 500
  roots:
    - backend/src
    - packages
    - frontend/src
    - scripts
    - tests
    - alembic
  extensions:
    - .py
    - .ts
    - .tsx
  exclude_globs:
    - "**/node_modules/**"
    - "**/.venv/**"
    - "**/dist/**"
    - "**/coverage/**"
    - "**/generated/**"
    - "**/__pycache__/**"
    - "**/.mypy_cache/**"
    - "**/.ruff_cache/**"
    - "**/.pytest_cache/**"
    - "alembic/versions/*.py"
