# =====================================================================
# FraudLens LLM Catalog - model CAPABILITY + TRUST registry (NON-SECRET).
# =====================================================================
#
# Structure:
#   - Top-level keys are providers (openai, anthropic, gemini, openrouter, ...).
#   - Second-level keys are model ids sent verbatim to that provider's API.
#   - Each model card is used for discovery, selection, fallback, and cost estimate:
#       kind, context_window, modality, default_params, pricing, speed,
#       reasoning_capable, intelligence, source_url, verified_at, lifecycle,
#       callable, and pricing_basis.
#
# A model is referenced as "<provider>/<model-id>", e.g. "openai/gpt-5-mini" or
# "openrouter/anthropic/claude-sonnet-4.6". The model id may contain slashes.
#
# CONNECTION + SECRETS LIVE ELSEWHERE:
#   - Endpoints, timeouts, retries, headers .... config/llm/providers.yml
#   - API keys ................................. Infisical /llm env vars named
#                                                in providers.yml; never here.
# =====================================================================

