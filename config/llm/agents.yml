graph_version: agents-v1
workflow:
  max_revisions: 1
  parallel_investigation: true
  agent_timeout_s: 45
  workflow_timeout_s: 180
  max_cost_usd_per_investigation: 0.10
  fallback_to_single_writer: true
quotas:
  live_runs_per_ip_per_day: 3
  live_runs_total_per_day: 10
agents:
  evidence_investigator:
    model: openrouter/x-ai/grok-4.3
    fallbacks: [openrouter/google/gemini-2.5-flash]
    prompt_id: v1
    max_output_tokens: 900
    max_tool_calls: 6
    tools: [transaction_history, rule_hits, shap_drivers, alert_history]
  regulatory_analyst:
    model: openrouter/google/gemini-2.5-flash
    fallbacks: [openrouter/x-ai/grok-4.3]
    prompt_id: v1
    max_output_tokens: 900
    max_tool_calls: 4
    tools: [regulation_search]
    top_k: 6
  sar_writer:
    model: openrouter/openai/gpt-5-mini
    fallbacks: [openrouter/google/gemini-2.5-flash]
    prompt_id: v1
    max_output_tokens: 3000
    reasoning_effort: minimal
    tools: []
  compliance_reviewer:
    model: openrouter/anthropic/claude-sonnet-4.6
    fallbacks: [openrouter/openai/gpt-5-mini]
    prompt_id: v1
    max_output_tokens: 800
    tools: []
