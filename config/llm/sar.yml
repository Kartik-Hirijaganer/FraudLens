# =====================================================================
# FraudLens SAR-drafting model selection (NON-SECRET).
# =====================================================================
#
# Model NAMES live HERE in config, never in source (no-hardcoding, plan §7.2 / §12).
# The live drafter resolves these refs against config/llm/catalog.yml + providers.yml.
#
# v1 live-local default is OpenRouter GPT-5 mini per Track B. Governance still gates fallback at
# the client: a weaker-posture provider is skipped unless policy-downgrade is explicitly allowed
# (non-prod) — plan §7.5. Compliance-upgrade path: flip `model` to an Azure OpenAI ref here,
# no code change (plan §7.1).
# =====================================================================

model: openrouter/openai/gpt-5-mini
fallbacks:
  - openrouter/google/gemini-2.5-flash
max_output_tokens: 3000
reasoning_effort: minimal
