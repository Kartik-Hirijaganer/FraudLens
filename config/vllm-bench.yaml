# Frozen, provider-neutral vLLM BF16-versus-AWQ SAR benchmark protocol.
# Secrets are injected at runtime; this file stores only environment-variable names.

seed: 1729
# Protocol v5 is the latency remediation discovered by the v4 live constrained smoke: the exact
# fact-object `oneOf` grammar passed quality but produced a 522.8-second p95. The model now emits a
# compact prose envelope; the backend hydrates canonical facts before the unchanged quality gate.
# Protocol v6 changes NO generation, request, or measurement semantics. It exists because the
# config hash covers the whole file byte-for-byte, and release 0.5.0 added the published cascade
# report's baseline and disclosures here. Versioning rather than mutating keeps the v5 full run
# bound to the exact bytes it executed under (AD-1.3).
protocol_version: vllm-sar-bench-v6
protocol_lineage:
  vllm-sar-bench-v1: b52e68d9ae6d288a6be3f2b2a158062ce64268c360d5c0446547c53be75bf240
  vllm-sar-bench-v2: 6c21b558cbb35dcc233c9ea945d5ac0363827d92d86c6b7396298fd8a20472e3
  vllm-sar-bench-v3: 4f9388d51ec47b0ef1f806e8784e56afcde3c67a66c42ba7d14bdcebdf4f5534
  vllm-sar-bench-v4: 47349665261b5c0f893b156227003e7192d40928df78bb674fb1796186f6c8cf
  vllm-sar-bench-v5: 57df143fde48dd7cfee6c14d366ea261d8bfa36c949e1be5ad5cbf0d7d70f169

cases:
  source: ibm-final-test
  count: 1000
  quotas:
    hi-small: 500
    hi-medium: 250
    li-medium: 250
  dev_count: 40
  warmup_count: 10
  abstention_fixtures: 20
  strata: [payment_format, amount_band, history_length_band, prompt_length_band]
  fulldata_config: config/fulldata.yaml
  application_candidate: hi-medium
  fixture_source: config/sar-eval.yaml
  license: CDLA-Sharing-1.0
  attribution: IBM AML transaction datasets (synthetic), IBM
  source_url: https://github.com/IBM/AML-Data

arms:
  bf16:
    model: Qwen/Qwen2.5-7B-Instruct
    revision: a09a35458c702b33eeacc393d103063234e8bc28
    tokenizer: Qwen/Qwen2.5-7B-Instruct
    tokenizer_revision: a09a35458c702b33eeacc393d103063234e8bc28
    dtype: bfloat16
    quantization: null
    safetensors_total_gib: "14.19"
  awq:
    model: Qwen/Qwen2.5-7B-Instruct-AWQ
    revision: b25037543e9394b818fdfca67ab2a00ecc7dd641
    tokenizer: Qwen/Qwen2.5-7B-Instruct
    tokenizer_revision: a09a35458c702b33eeacc393d103063234e8bc28
    dtype: auto
    quantization: awq_marlin
    safetensors_total_gib: "5.20"

server:
  image: vllm/vllm-openai
  image_tag: v0.10.2
  container_name: fraudlens-vllm-bench
  docker_publish_host: 127.0.0.1
  docker_bind_host: 0.0.0.0
  process_bind_host: 127.0.0.1
  port: 8000
  base_url: http://127.0.0.1:8000/v1
  base_url_env: VLLM_BENCH_BASE_URL
  api_key_env: VLLM_API_KEY
  image_digest_env: VLLM_IMAGE_DIGEST
  max_model_len: 8192
  gpu_memory_utilization: "0.90"
  max_num_seqs: 64
  enable_prefix_caching: false
  extra_args: []
  log_source:
    kind: docker
    target: fraudlens-vllm-bench
    command_prefix: []

request:
  max_tokens: 512
  temperature: 0.0
  json_object_mode: true
  constrained_decoding: true
  seed_requests: true
  timeout_s: 300
  max_attempts: 2
  allowed_plain_http_hosts: [127.0.0.1, localhost, 10.0.0.4]

application_pass:
  base_url: http://127.0.0.1:18000
  base_url_env: FRAUDLENS_E2E_BASE_URL
  auth_token_env: FRAUDLENS_E2E_AUTH_TOKEN
  # Workload bounds for the functional API -> worker -> vLLM pass. These are the ONLY place the
  # limits are stated; `e2e.py` restated each of them three times before release 0.5.0.
  default_cases: 100
  default_concurrency: 4
  max_cases: 1000
  max_concurrency: 64

load:
  concurrency_levels: [1, 8, 32]
  warmup_requests: 10
  cooldown_s: 15
  case_order: shuffled
  max_error_rate: 0.0

telemetry:
  sampler: nvidia_smi
  interval_s: 1.0
  command_prefix: []
  dcgm_url: http://127.0.0.1:9400/metrics
  prometheus_url: http://127.0.0.1:8000/metrics

cost:
  default_host: runpod-rtx4090
  hosts:
    azure-nc24ads-a100:
      provider: azure
      sku: Standard_NC24ads_A100_v4
      region: eastus
      prices:
        pay_as_you_go: "3.673000"
        spot: "0.678770"
      price_source_url: https://prices.azure.com/api/retail/prices
      price_verified_at: 2026-09-13
    azure-nv36ads-a10:
      provider: azure
      sku: Standard_NV36ads_A10_v5
      region: eastus
      prices:
        pay_as_you_go: "3.200000"
        spot: "0.591360"
      price_source_url: https://prices.azure.com/api/retail/prices
      price_verified_at: 2026-09-13
    runpod-rtx4090:
      provider: runpod
      sku: NVIDIA GeForce RTX 4090
      region: secure-cloud
      prices:
        pay_as_you_go: "0.740000"
      price_source_url: https://www.runpod.io/pricing
      price_verified_at: 2026-09-14
  comparison_model:
    model: openrouter/openai/gpt-5-mini
    input_per_million_usd: "0.25"
    output_per_million_usd: "2.00"
  drafts_per_unit: 1000

# Benchmark-only quality warnings. Citation precision and required-fact coverage are NOT
# restated here: config/quality.yaml owns every aggregate quality threshold, and the loader binds
# them from there so the benchmark and the CI gate suites can never judge by different floors.
quality:
  schema_valid_min: 0.99
  awq_delta_warn_pp: 5.0

acceptance:
  weight_memory_reduction_min: 0.50
  token_accounting_drift_max: 0.05
  require_gpu_telemetry: true
  # A gated cascade exists to serve MORE cases than its first tier alone. Publishing below the
  # single-model baseline would mean publishing a regression as an improvement.
  cascade_final_pass_rate_min: 0.99

# Protocol-v2 scenario matrix. A scenario measures the PRODUCTION cascade through a named SAR
# profile, so no model reference, connection, or decoding mode is restated here — those belong to
# config/llm/sar-vllm.yml and config/llm/providers.yml. Raw quantization scenarios keep all three
# levels on ONE endpoint (equal hardware, AD-4.2); cascade scenarios need both endpoints reachable
# at once and run the level the free replay pilot sized and costed (AD-4.3).
cascade:
  sar_config_file: llm/sar-vllm.yml
  replay_run_id: vllm-bench-f810b57a7b8ae05a
  replay_policy: replay_gate
  allocation: gpu_benchmark
  rate_key: runpod_rtx4090_secure_payg
  endpoints:
    awq:
      arm: awq
      connection: runpod-awq
      telemetry_prefix_env: VLLM_AWQ_TELEMETRY_PREFIX
    bf16:
      arm: bf16
      connection: runpod-bf16
      telemetry_prefix_env: VLLM_BF16_TELEMETRY_PREFIX
  scenarios:
    - name: bf16-baseline
      profile: bf16-baseline
      endpoints: [bf16]
      concurrency_levels: [1, 8, 32]
    - name: awq-raw
      profile: awq-raw
      endpoints: [awq]
      concurrency_levels: [1, 8, 32]
    # Compact-contract controls. AWQ runs first as the paid canary; BF16 is created only after the
    # AWQ gate and latency checks pass. Together they isolate quantization from cascade overhead.
    - name: awq-constrained
      profile: awq-constrained
      endpoints: [awq]
      concurrency_levels: [32]
    - name: bf16-constrained
      profile: bf16-constrained
      endpoints: [bf16]
      concurrency_levels: [32]
    - name: awq-bf16-unconstrained
      profile: awq-bf16-unconstrained
      endpoints: [awq, bf16]
      concurrency_levels: [32]
    - name: awq-bf16
      profile: awq-bf16
      endpoints: [awq, bf16]
      concurrency_levels: [32]
    - name: awq-bf16-external
      profile: awq-bf16-external
      endpoints: [awq, bf16]
      concurrency_levels: [32]
  # What the published cascade report compares against, and what it must admit about itself.
  # Disclosures live here rather than in the renderer so the limitations stay reviewable next to
  # the protocol that produced them (release 0.5.0 Phase 5).
  report:
    baseline: bf16-baseline
    disclosures:
      - >-
        Cascade case latency is measured across TWO simultaneously provisioned endpoints; the
        BF16 and AWQ raw comparisons use ONE. Every comparison row states which it is, and p95 is
        published next to GPU-seconds per case and aggregate peak device memory for that reason.
      - >-
        Guided (constrained) decoding was excluded from the published matrix after its live
        latency canary: the exact fact-object grammar passed quality at 8/8 but measured a
        441.6-second p95 at concurrency 32. The shipped contract is a compact prose envelope the
        backend hydrates, judged by the identical deterministic gate.
      - >-
        Three of 1,000 cases carry no evidence and fail preflight before any model call. They are
        counted as terminal cascade failures, never omitted, and are the entire gap between the
        99.7% served share and 100%.
      - >-
        The RunPod provider stopped reporting Pod volume encryption during this release, so the
        frozen contract's encrypted-volume verification could not be satisfied. The corpus is the
        public IBM AML synthetic dataset and contains no PHI; the observed encryption state is
        recorded on every affected ledger row (ADR-030).
      - >-
        CUDA runtime capture was added after this matrix ran, so the endpoint provenance publishes
        it as not captured rather than inferring it from the driver version. The pinned image
        digest fixes the CUDA toolchain the run actually used.
      - >-
        Accepted-draft quality is measured over served drafts only, so abstention correctness is
        published as null rather than as a rate: computed over accepted drafts it would be a
        vacuous 1.0. Abstention appears instead as the evidence-free cases this run refused before
        any model call, in the terminal-failure table.
      - >-
        No hosted external tier was exercised: the published cascade is AWQ then BF16, both
        self-hosted. The external tier ships configured but unmeasured, so no OpenRouter
        zero-data-retention eligibility snapshot exists for this run.

kv_cache_mode: equal_utilization

paths:
  output_dir: .local/vllm-bench

profiles:
  smoke:
    cases_count: 8
    concurrency_levels: [1, 2]
    warmup_requests: 1
  development:
    cases_count: 40
    concurrency_levels: [32]
    warmup_requests: 1
    case_set: development
  full: {}
