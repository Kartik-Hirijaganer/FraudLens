# =====================================================================
# FraudLens Tier-3 external-model pilot — FROZEN case set (NON-SECRET).
# =====================================================================
# Release 0.5.0 Phase 3 pre-registers this pilot: the case set, the candidate
# models, the acceptance thresholds, and the selection rule are all fixed HERE,
# before either candidate has been run, so the Tier-3 model is decided by
# measurement rather than chosen after seeing results. The selected model is
# frozen before the Phase 4 full run and is never changed after seeing it.
#
# Cases are drawn from REAL escalation traffic in the persisted benchmark run,
# not synthesised: every case below is one the deterministic gate actually
# rejected on the self-hosted tiers, which is the only traffic Tier 3 ever sees.
# The run measured 1,000 cases across concurrency 1/8/32 per arm; exactly
# 88 of them failed BOTH arms at some level, which is the whole
# both-tier-failure population and is fewer than the 100 the pilot fixes. The
# remaining 12 are the hardest escalation candidates left:
# cases the AWQ tier failed, ordered by case id so the choice is reproducible and
# carries no selection freedom. Composition is recorded below, not implied.
#
# Running the pilot spends money at a hosted provider and is therefore an
# owner-approved action under Golden Rule 7; this file is its fixed input.
# =====================================================================

