# Fixed in advance: the cheapest candidate clearing EVERY threshold wins; a tie
# goes to gpt-5-mini on cost. Thresholds are the committed config/quality.yaml
# SAR thresholds — this file does not get to invent softer ones.
tie_break_model: openrouter/openai/gpt-5-mini

