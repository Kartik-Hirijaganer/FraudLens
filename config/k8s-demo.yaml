# FraudLens local Kubernetes proof configuration (non-secret).
cluster_name: fraudlens-demo
kubernetes_version: "1.32.8"
kind_version: "0.31.0"
kind_node_image: kindest/node:v1.32.8@sha256:abd489f042d2b644e2d033f5c2d900bc707798d075e8186cb65e3f1367a9d5a1
kubeconform_version: "0.7.0"
metrics_server_version: "0.9.0"
namespace: fraudlens
image: fraudlens-backend:local
service: fraudlens-api
local_port: 18080
startup_timeout_seconds: 420
metrics_timeout_seconds: 240
sample_interval_seconds: 15
scale_up_timeout_seconds: 300
scale_down_timeout_seconds: 900
load:
  target_url: http://fraudlens-api:8000/healthz
  mode: healthz
  concurrency: 32
  duration_seconds: 240
  reconnect_every: 200
  cases: 100
