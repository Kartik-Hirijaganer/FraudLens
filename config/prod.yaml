environment: prod
log_level: INFO
cors_allow_origins: []
cors_allow_credentials: true

portfolio_demo_enabled: true
storage_backend: azure_blob
queue_backend: container_apps_jobs
llm_mode: live
multi_agent_sar_enabled: false

llm_daily_budget_usd: 2.25
azure_managed_identity_token_url: "http://169.254.169.254/metadata/identity/oauth2/token"
azure_arm_endpoint: "https://management.azure.com"
azure_arm_token_resource: "https://management.azure.com/"
azure_storage_token_resource: "https://storage.azure.com/"

rag_index_required: true
infisical_secrets_delivery: externally_injected
infisical_required_env_keys:
  - DATABASE_URL
  - SUPABASE_SERVICE_ROLE_KEY
