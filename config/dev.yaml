# Development overlay (non-secret). Applied on top of default.yaml.
environment: dev
log_level: DEBUG

# Convenience for local development only. This flag is INERT in prod mode
# regardless of value (proven by tests in backend), so it is safe to enable here.
auth_dev_bypass: true

# The Vite dev server origin (config, not source — keeps URLs out of code). The
# one-command demo serves the SPA from here and calls the gateway at :8000.
cors_allow_origins:
  - http://localhost:5173
cors_allow_credentials: true

# Local-only backends + keyless mock SAR drafter: `make local-demo` needs no cloud.
storage_backend: local
queue_backend: local
llm_mode: mock
