# FraudLens — uv workspace root.
#
# This is a NON-package project (`[tool.uv] package = false`): it owns the
# workspace definition, the shared dev-tool dependency group, and the shared
# ruff / mypy / pytest / coverage / interrogate configuration. Application code
# lives in the workspace members (`backend`, `packages/*`).
#
# Layering (ruff-enforced per-package, see packages/*/pyproject.toml):
#   fraudlens-core -> (nothing internal)
#   fraudlens-llm  -> (nothing internal; standalone provider client)
#   fraudlens-ml   -> may import fraudlens-core, never fraudlens-backend
#   fraudlens-backend -> may import both

[project]
name = "fraudlens"
version = "0.1.0"
description = "FraudLens — AML fraud investigation system (workspace root)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kartik Hirijaganer" }]
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "packages/*"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "interrogate>=1.7",
    "vulture>=2.13",
    "types-pyyaml>=6.0",
]

# ---------------------------------------------------------------------------
# ruff — lint + format (shared baseline; per-package layering bans extend this)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = [
    "backend/src",
    "packages/fraudlens-core/src",
    "packages/fraudlens-llm/src",
    "packages/fraudlens-ml/src",
    "scripts",
    "tests",
]
extend-exclude = ["docs/reference/generated", "infra"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "PL", "RUF"]
# PLR2004 (magic-value comparison) is intentionally kept ON — it is part of the
# "no hardcoded values" guard (rule 4). Tests relax it (see per-file-ignores).

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["fraudlens_backend", "fraudlens_core", "fraudlens_llm", "fraudlens_ml"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]            # re-exports are intentional
"tests/**" = ["PLR2004", "PLR0913", "PLR0915"]
"**/conftest.py" = ["PLR2004"]
"scripts/**" = ["PLR0912", "PLR0915"]  # checkers branch a lot by design

# ---------------------------------------------------------------------------
# mypy — strict, pydantic plugin. Paths are passed by `make typecheck`.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
mypy_path = [
    "backend/src",
    "packages/fraudlens-core/src",
    "packages/fraudlens-llm/src",
    "packages/fraudlens-ml/src",
    "scripts",
]
exclude = ['(^|/)(build|dist|\.venv|node_modules)/']

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest + coverage (backend stack; ≥90% branch coverage)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not smoke' --cov --cov-report=term-missing --cov-fail-under=90 --strict-markers"
markers = [
    "smoke: live-URL smoke tests run against a deployed environment (deploy gate)",
]

[tool.coverage.run]
branch = true
source = ["fraudlens_backend", "fraudlens_core", "fraudlens_llm", "fraudlens_ml"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

# ---------------------------------------------------------------------------
# interrogate — docstring coverage ≥90% (SUMMARY header = module docstring)
# ---------------------------------------------------------------------------
[tool.interrogate]
fail-under = 90
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-nested-functions = true
ignore-private = false
ignore-property-decorators = true
exclude = ["tests", "build", "dist", "scripts/lib/__pycache__"]
