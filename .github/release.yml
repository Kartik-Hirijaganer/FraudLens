# GitHub auto-generated release notes grouping (used by release.yml's gh-release step,
# complementing the git-cliff CHANGELOG).
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: ⚠️ Breaking Changes
      labels:
        - breaking
    - title: 🚀 Features
      labels:
        - feature
        - feat
    - title: 🐛 Fixes
      labels:
        - fix
        - bug
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: 🔧 Other Changes
      labels:
        - "*"
