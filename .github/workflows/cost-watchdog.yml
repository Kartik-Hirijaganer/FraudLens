# Daily leftover-resource watchdog (Phase 2). Azure budget data lags by hours and the
# subscription spending limit is off, so alerts alone cannot catch a forgotten teardown: on a $15
# AKS budget a surviving cluster could burn for a week before crossing a threshold. This run
# detects it within 24 hours instead, and fails the workflow so GitHub's normal Actions
# notification reaches the owner.
#
# Every `az` call below is READ-ONLY (exists / list / show / query). The job creates, updates, and
# deletes nothing, so Golden Rule 7 does not gate it — the paired mutating targets stay behind
# `make aks-down CONFIRM=yes`. Read-only also means a false alarm costs nothing but a re-read.
#
# The cron is the one hardcoded value here: GitHub Actions cannot read a repo variable in
# `on.schedule.cron`. Thresholds and group names live in env below, not scattered through the run
# blocks. Scheduled triggers are best-effort and can be delayed under load; a late check costs
# detection latency, not money.
name: cost-watchdog

on:
  schedule:
    - cron: "0 13 * * *" # daily 13:00 UTC — after overnight sessions, before the US workday
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # GitHub→Azure OIDC only; no stored client secret, no Infisical read

concurrency:
  group: cost-watchdog
  cancel-in-progress: false

env:
  AKS_RESOURCE_GROUPS: "fraudlens-aks-demo-rg fraudlens-aks-demo-nodes-rg"
  PROJECT_TAG: "project=FraudLens"
  APP_NAME: "fraudlens-prod-api"
  RESOURCE_GROUP: "fraudlens-prod-rg"

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # An ephemeral AKS group that survived its session is the single most expensive failure
      # this repo can have (~$126/month if left running), so it is checked first and hard-fails.
      - name: Refuse a surviving ephemeral AKS resource group
        id: groups
        run: |
          set -euo pipefail
          failed=0
          for group in $AKS_RESOURCE_GROUPS; do
            if [ "$(az group exists --name "$group")" != "false" ]; then
              echo "::error::ephemeral resource group $group still exists — run 'make aks-down CONFIRM=yes'"
              failed=1
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: List any managed cluster in the subscription
        run: |
          set -euo pipefail
          az aks list --query "[].{name:name,resourceGroup:resourceGroup,state:powerState.code}" -o table

      - name: Inventory every tagged FraudLens resource
        run: |
          set -euo pipefail
          az resource list --tag "$PROJECT_TAG" \
            --query "[].{name:name,type:type,resourceGroup:resourceGroup,location:location}" -o table

      - name: Show the configured budgets and their thresholds
        run: |
          set -euo pipefail
          az consumption budget list \
            --query "[].{name:name,amount:amount,timeGrain:timeGrain,notifications:length(keys(notifications))}" \
            -o table

      # `az costmanagement query` DOES NOT EXIST — the costmanagement extension provides
      # `export` and `show` only. The previous step called it and swallowed the failure with
      # `2>/dev/null || echo "0"`, so this check reported "month-to-date actual cost: 0 USD" and
      # passed every day since it was written, including through the 2026-09-22 budget alert it
      # existed to pre-empt. The read now goes through the REST API the portal itself uses, and
      # a failed read fails the step instead of becoming an implicit zero.
      #
      # Attribution matters as much as the total. That $12.51 alert was 80% ledgered, torn-down
      # experiment spend and 20% a stuck replica; separating them took a manual investigation.
      # `check_azure_spend.py` splits the month by the committed policy in
      # `config/cost-model.yaml`, so the next alert answers "drift or governed?" on its own and
      # gates on the recurring portion — the only part that is supposed to be stable.
      - name: Attribute month-to-date spend and gate on recurring drift
        id: cost
        run: |
          set -euo pipefail
          uv sync --all-packages
          scope="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}"
          url="https://management.azure.com${scope}/providers/Microsoft.CostManagement/query?api-version=2023-03-01"
          read -r -d '' query <<'JSON' || true
          {"type":"ActualCost","timeframe":"MonthToDate","dataset":{"granularity":"None",
           "aggregation":{"totalCost":{"name":"Cost","function":"Sum"}},
           "grouping":[{"type":"Dimension","name":"ResourceGroupName"}]}}
          JSON
          # Cost Management throttles hard (HTTP 429). Retrying is the difference between a real
          # reading and a spurious alarm; exhausting the retries leaves mtd.json empty, which the
          # checker treats as a FAILURE rather than as $0.
          mtd="${RUNNER_TEMP:-.}/mtd.json"
          : > "$mtd"
          for attempt in 1 2 3 4 5; do
            if az rest --method post --url "$url" --body "$query" -o json > "$mtd"; then
              break
            fi
            echo "cost query attempt $attempt failed; retrying in $((attempt * 15))s"
            : > "$mtd"
            sleep $((attempt * 15))
          done
          over=0
          uv run python scripts/check_azure_spend.py --input "$mtd" || over=$?
          echo "over=$over" >> "$GITHUB_OUTPUT"

      # A Container Apps revision that holds a replica while taking no traffic bills for a
      # replica nobody can reach. The deploy workflow's `abort` job covers the revision IT
      # staged; it cannot cover a revision created by a manual `az containerapp update`, and a
      # revision that fails activation WHILE holding a replica takes no traffic, so the
      # traffic-driven scaler never scales it away. Observed 2026-09-22:
      # `fraudlens-prod-api--0000019` sat ActivationFailed at 1 replica and 0% traffic for 72
      # hours, doubling the recurring bill and tripping the 50% budget alert.
      #
      # The test is deliberately state-machine-independent — replicas>0 AND traffic==0 — because
      # the 19 other ActivationFailed revisions held zero replicas: the failure state is not what
      # predicts the cost, holding a replica is. Read-only (`revision list`), so Golden Rule 7
      # does not gate it; deactivation stays a human action.
      - name: Refuse a revision billing replicas at zero traffic
        id: revisions
        run: |
          set -euo pipefail
          az containerapp revision list -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query "[?properties.active].{name:name,replicas:properties.replicas,traffic:properties.trafficWeight,state:properties.runningState,health:properties.healthState}" \
            -o table
          idle="$(az containerapp revision list -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query "[?properties.active && properties.replicas > \`0\` && properties.trafficWeight == \`0\`].name" \
            -o tsv)"
          failed=0
          if [ -n "$idle" ]; then
            failed=1
            while IFS= read -r revision; do
              [ -n "$revision" ] || continue
              echo "::error::revision $revision holds replicas at 0% traffic — billing for an unreachable replica; deactivate with 'az containerapp revision deactivate -n $APP_NAME -g $RESOURCE_GROUP --revision $revision'"
            done <<< "$idle"
          else
            echo "no revision holds replicas at zero traffic"
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      # One place to fail, so every check above always runs and the whole picture is in the log.
      - name: Fail on residue or overspend
        run: |
          set -euo pipefail
          if [ "${{ steps.groups.outputs.failed }}" != "0" ] \
            || [ "${{ steps.revisions.outputs.failed }}" != "0" ] \
            || [ "${{ steps.cost.outputs.over }}" != "0" ]; then
            echo "cost-watchdog FAILED: see the annotated errors above"
            exit 1
          fi
          echo "cost-watchdog OK: no ephemeral resource group survives, no revision bills at zero traffic, recurring spend is under threshold, and every billed group is declared"
