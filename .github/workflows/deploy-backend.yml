# Backend deploy (plan §15.4 / §15.7 / Phase 14) — WIRED BUT INERT until the Azure account
# exists. Deploys run only from `dev` / `release/*` after CI succeeds, and the cloud jobs run
# only when the repo variable AZURE_DEPLOY_ENABLED == 'true'; until then only `verify` runs
# (re-running the SAME gate at the deployed SHA — deploy parity).
#
# Fast & reliable deploy (ADR-013):
#   build-once-promote-many : ONE immutable image (SHA tag) is built and pushed to GHCR, then
#                             reused unchanged through stage -> promote (never rebuilt).
#   app rollout != infra     : terraform apply runs ONLY when the plan is non-empty; the common
#                             path is a fast Container Apps revision (no per-deploy terraform).
#   revision @0% -> promote  : the new revision is staged at 0% traffic; gated expand/contract
#                             migrations -> smoke -> promote to 100% ONLY if green, else auto-abort
#                             with the previous revision still serving 100% (a broken version
#                             never reaches users).
#   resilience               : per-job timeouts, step retries/backoff, concurrency (no overlap).
#
# Secrets posture: Azure auth is GitHub->Azure OIDC (id-token: write; no stored client secret).
# The image source is public GHCR (no registry credential). App + DB secrets are fetched at
# runtime from Infisical, never injected into the image or terraform state.
name: deploy-backend

# `workflow_run` always executes the workflow file from the DEFAULT branch, whatever ref
# triggered it -- so a deploy change on a release branch is inert until it is merged.
# `workflow_dispatch` executes the file from the ref it is dispatched against, which is how a
# release branch iterates on its own deploy without a merge per attempt. The gates are unchanged
# either way: `verify` re-runs the full CI suite at the deployed SHA, AZURE_DEPLOY_ENABLED still
# gates every cloud job, and `environment: production` still requires human approval.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches:
      - dev
      - "release/*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write # push the backend image to GHCR

concurrency:
  group: deploy-backend
  cancel-in-progress: false # never cancel an in-flight deploy

env:
  APP_NAME: fraudlens-prod-api
  RESOURCE_GROUP: fraudlens-prod-rg
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  REVISION_SUFFIX: s${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Golden Rules 2 and 7: refuse any deploy that is not the personal identity owning this repo
  # and the Azure subscription. Every job below descends from `verify`, so this single edge gates
  # the whole graph before anything billable is touched.
  identity:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a non-personal deploy identity
        run: bash scripts/check_deploy_identity.sh

  # Deploy parity: re-run the identical gate at the exact SHA being deployed.
  verify:
    needs: identity
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    uses: ./.github/workflows/_ci-reusable.yml

  # Build ONE immutable image (SHA tag) and push to GHCR. The same digest is promoted unchanged.
  build-push:
    needs: verify
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Compute image reference (build-once SHA tag)
        id: meta
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image_name="ghcr.io/${owner}/fraudlens-backend"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "base_image=ghcr.io/${owner}/fraudlens-base:latest" >> "$GITHUB_OUTPUT"
          echo "image=${image_name}:${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Thin build FROM the prebuilt base, with registry + GHA layer caches so only changed layers
      # rebuild/push. Native linux/amd64 (no emulation). Pushed once, promoted many.
      - name: Build & push (cached, build-once)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          build-args: BASE_IMAGE=${{ steps.meta.outputs.base_image }}
          tags: ${{ steps.meta.outputs.image }}
          push: true
          cache-from: |
            type=registry,ref=${{ steps.meta.outputs.image_name }}:buildcache
            type=gha
          cache-to: |
            type=registry,ref=${{ steps.meta.outputs.image_name }}:buildcache,mode=max
            type=gha,mode=max
      # `acr_enabled = false` means the Container App pulls this image with NO registry
      # credential. A package left private fails inside Azure minutes later as an opaque
      # image-pull error against a revision that already exists, so pullability is proven here,
      # anonymously, and the deploy stops with the real reason. The fix is to publish the GHCR
      # package — never to switch the deploy to a private registry.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Assert the image is anonymously pullable from GHCR
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          uv sync --all-packages
          uv run python scripts/check_public_image.py "$IMAGE"

  # Provision infra ONLY when it actually changed (plan non-empty). The common code deploy skips
  # this entirely — the slow step is not on the hot path (§15.7).
  infra:
    needs: build-push
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # `terraform_wrapper: false` is load-bearing, not hygiene. The default wrapper intercepts
      # the binary to capture step outputs and does not preserve `-detailed-exitcode`, so
      # terraform's "2 = changes pending" arrives as 0 and the apply below is skipped on a plan
      # that had 14 resources to add -- silently, with the job reporting success.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform plan; apply only if the plan is non-empty
        working-directory: infra/terraform/environments/prod
        env:
          ARM_USE_OIDC: "true"
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          TF_VAR_client_id: ${{ vars.AZURE_CLIENT_ID }}
          # The prod root carries its own RG-scoped budget, whose recipient and start month are
          # human-owned and therefore have NO default (Golden Rule 3) -- without them `plan` stops
          # at "No value for required variable". Same shape deploy-aks.yml already uses.
          TF_VAR_budget_contact_emails: '["${{ vars.AZURE_BUDGET_CONTACT_EMAIL }}"]'
          TF_VAR_budget_start_date: ${{ vars.AZURE_BUDGET_START_DATE }}
        run: |
          set -euo pipefail
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i…"; sleep $((i*10)); done; return 1; }
          cp backend.tf.template backend.tf
          retry terraform init -input=false -lock-timeout=120s
          # -detailed-exitcode: 0=no changes, 2=changes pending, 1=error.
          set +e
          terraform plan -input=false -lock-timeout=120s -detailed-exitcode \
            -var-file=prod.tfvars -var="container_image=${{ needs.build-push.outputs.image }}" -out=tfplan
          code=$?
          set -e
          echo "terraform plan -detailed-exitcode => $code"
          # Cross-check the exit code against the plan file itself. "Skip the apply" is the one
          # outcome that looks like success while doing nothing, so it has to be proven, not
          # inferred from a status another tool could have rewritten.
          changes=$(terraform show -json tfplan | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("resource_changes",[])))')
          echo "planned resource changes: $changes"
          if [ "$code" = "2" ] || [ "$changes" != "0" ]; then
            echo "infra changed — applying"; retry terraform apply -input=false -lock-timeout=120s -auto-approve tfplan
          elif [ "$code" = "0" ]; then
            echo "no infra changes — skipping apply (fast app-rollout path)"
          else
            exit "$code"
          fi

  # Stage the new image as a Container Apps revision at 0% traffic (Multiple revision mode keeps
  # the prior revision serving). A fast `az containerapp update` — no terraform.
  #
  # This job also owns SECRET INJECTION (D8). Container Apps has no secret store of its own, so
  # the four allowlisted runtime values are fetched from Infisical over OIDC, written as
  # app-scoped Container Apps secrets, and referenced by env vars in the SAME update that stamps
  # the image — so the staged revision boots with them and `/readyz` verifies the injection
  # BEFORE any traffic shift. Values never enter terraform state, tfvars, an artifact, a job
  # output, or another job; `ignore_changes = [secret]` (D7) stops the next apply stripping them.
  stage:
    needs: [build-push, infra]
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    outputs:
      revision_fqdn: ${{ steps.stage.outputs.revision_fqdn }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Three explicit non-recursive paths, not a recursive root fetch: the job should hold only
      # the secrets this deployment injects, and the path list is the documented inventory
      # (docs/runbooks/infisical-secrets.md). Every fetched value is registered as a log mask.
      - name: Fetch backend runtime secrets from Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_GITHUB_ACTIONS_IDENTITY_ID }}
          oidc-audience: https://github.com/Kartik-Hirijaganer
          domain: https://app.infisical.com
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /backend
      - name: Fetch the LLM provider key from Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_GITHUB_ACTIONS_IDENTITY_ID }}
          oidc-audience: https://github.com/Kartik-Hirijaganer
          domain: https://app.infisical.com
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /llm
      - name: Fetch the project URL and synthetic demo credential from Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_GITHUB_ACTIONS_IDENTITY_ID }}
          oidc-audience: https://github.com/Kartik-Hirijaganer
          domain: https://app.infisical.com
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /
      # The allowlist IS the contract: exactly four values are injected, each read out of the
      # environment by NAME so no value is ever written into this file, and a missing one fails
      # the deploy naming only the variable. `secret set` is app-scoped and creates no revision.
      - name: Inject the four allowlisted runtime secrets
        run: |
          set -euo pipefail
          missing=()
          pairs=()
          allow() { # $1 = Container Apps secret name, $2 = injected env var NAME
            local value="${!2-}"
            if [ -z "$value" ]; then missing+=("$2"); return 0; fi
            pairs+=("$1=$value")
          }
          allow database-url DATABASE_URL
          allow supabase-service-role-key SUPABASE_SERVICE_ROLE_KEY
          allow demo-auth-password FRAUDLENS_DEMO_AUTH_PASSWORD
          allow openrouter-api-key OPENROUTER_API_KEY
          if [ -z "${SUPABASE_URL:-}" ]; then missing+=("SUPABASE_URL"); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Infisical did not supply: ${missing[*]} (names only — never a value)"
            exit 1
          fi
          az containerapp secret set -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --secrets "${pairs[@]}" --output none
      - name: Create revision at 0% traffic
        id: stage
        run: |
          set -euo pipefail
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i…"; sleep $((i*10)); done; return 1; }
          # The JWKS URL and the issuer are DERIVED from the project URL rather than stored
          # twice; both are non-secret, so they are plain env, not secret references.
          supabase_url="${SUPABASE_URL%/}"
          retry az containerapp update -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --image "${{ needs.build-push.outputs.image }}" --revision-suffix "$REVISION_SUFFIX" \
            --set-env-vars \
              "DATABASE_URL=secretref:database-url" \
              "SUPABASE_SERVICE_ROLE_KEY=secretref:supabase-service-role-key" \
              "FRAUDLENS_DEMO_AUTH_PASSWORD=secretref:demo-auth-password" \
              "OPENROUTER_API_KEY=secretref:openrouter-api-key" \
              "SUPABASE_URL=${supabase_url}" \
              "FRAUDLENS_AUTH_JWKS_URL=${supabase_url}/auth/v1/.well-known/jwks.json" \
              "FRAUDLENS_AUTH_JWT_ISSUER=${supabase_url}/auth/v1"
          fqdn=$(az containerapp revision show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --revision "${APP_NAME}--${REVISION_SUFFIX}" --query properties.fqdn -o tsv)
          echo "revision_fqdn=https://${fqdn}" >> "$GITHUB_OUTPUT"

  # Gated pre-promote migration: expand/contract (backward-compatible) Alembic upgrade against
  # Supabase. Old + new revisions coexist during the shift, so a slow/failed migration blocks
  # promotion WITHOUT breaking the live revision. Own timeout + retry.
  migrate:
    needs: stage
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Fetch DATABASE_URL from Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_GITHUB_ACTIONS_IDENTITY_ID }}
          oidc-audience: https://github.com/Kartik-Hirijaganer
          domain: https://app.infisical.com
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /backend
      # SUPABASE_URL and the public synthetic demo password live at the project root; the demo
      # persona provisioning below needs both, and the smoke job mints its tokens from the same
      # pair. Fetched here rather than recursively so the job holds only what it uses.
      - name: Fetch the project URL and synthetic demo credential from Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_GITHUB_ACTIONS_IDENTITY_ID }}
          oidc-audience: https://github.com/Kartik-Hirijaganer
          domain: https://app.infisical.com
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /
      - name: Alembic upgrade head (expand/contract, gated)
        run: |
          set -euo pipefail
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i…"; sleep $((i*10)); done; return 1; }
          uv sync --all-packages
          retry uv run alembic upgrade head
      # Portfolio demo story (plan §16 Phase 7). DOUBLE-GATED: the job already requires
      # AZURE_DEPLOY_ENABLED, and this step additionally requires PORTFOLIO_DEMO_BOOTSTRAP_ENABLED
      # — the same shape deploy-frontend.yml uses. Gated on repo `vars`, never `secrets`:
      # enablement is a deployment decision, not a credential. It lives here because this is the
      # only job already holding the deployed-SHA checkout, uv, and DATABASE_URL from Infisical
      # /backend, and it runs PRE-PROMOTE, so a story that does not match its configuration fails
      # the job, blocks promotion, and lets the existing `abort` job deactivate the revision.
      #
      # The bootstrap is idempotent (it resumes rather than duplicates) and refuses rather than
      # guesses. Two prerequisites before flipping the variable on: the pinned model bundle named
      # by config/portfolio-demo.yaml must be reachable at the artifacts root, and the runner's
      # resolved llm_mode / rag_embedding_mode must equal the story's `execution:` block (the
      # default overlay this step runs under already does).
      #
      # Persona provisioning runs FIRST and under the same gate: the story records audited
      # actions under the configured personas, and the smoke job signs in as two of them, so the
      # Supabase Auth identities and their tenant-scoped `public.users` rows must exist before
      # either. The script is idempotent (it reconciles rather than duplicates) and refuses to
      # run when the resolved application environment is `prod`, which is why it runs on the
      # runner's default overlay against the production database rather than inside the image.
      - name: Provision the synthetic demo personas (gated, pre-promote)
        if: ${{ vars.PORTFOLIO_DEMO_BOOTSTRAP_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          uv run python scripts/provision_demo_auth.py
      - name: Bootstrap the portfolio demo story (gated, pre-promote)
        if: ${{ vars.PORTFOLIO_DEMO_BOOTSTRAP_ENABLED == 'true' }}
        env:
          FRAUDLENS_PORTFOLIO_DEMO_ENABLED: "true"
        run: |
          set -euo pipefail
          uv run python scripts/bootstrap_portfolio_demo.py

  # Smoke the STAGED revision (still at 0% traffic) before any traffic shift.
  #
  # `environment: production` is required, not decorative: both the Infisical OIDC identity and
  # the federated Azure subject are registered against that environment, and this job now needs
  # each — Infisical to mint persona tokens, Azure to read back the revision's own log.
  smoke:
    needs: [stage, migrate]
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The same three Infisical paths the injection reads, fetched for two reasons. Two personas
      # are signed in with the public synthetic password — an analyst (the permitted path) and an
      # auditor (the refused path) — so the smoke exercises real role separation rather than the
      # unauthenticated subset. And the leakage scan below searches the revision's log for these
      # VALUES: scanning for a name with nothing behind it would report a clean log no matter
      # what leaked, which is why `check_log_leakage.py` refuses an uninjected name.
      - name: Fetch backend runtime secrets from Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_GITHUB_ACTIONS_IDENTITY_ID }}
          oidc-audience: https://github.com/Kartik-Hirijaganer
          domain: https://app.infisical.com
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /backend
      - name: Fetch the LLM provider key from Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_GITHUB_ACTIONS_IDENTITY_ID }}
          oidc-audience: https://github.com/Kartik-Hirijaganer
          domain: https://app.infisical.com
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /llm
      - name: Fetch the project URL and synthetic demo credential from Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_GITHUB_ACTIONS_IDENTITY_ID }}
          oidc-audience: https://github.com/Kartik-Hirijaganer
          domain: https://app.infisical.com
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /
      # Masked the instant they exist and exported only into this job's environment; never
      # printed, stored as an artifact, or passed to another job.
      - name: Mint short-lived persona tokens (masked)
        if: ${{ vars.PORTFOLIO_DEMO_BOOTSTRAP_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          uv sync --all-packages
          uv run python scripts/smoke_auth_token.py \
            --export analyst=SMOKE_AUTH_TOKEN --export auditor=SMOKE_AUDITOR_TOKEN
      # This job sits exactly where the portfolio-demo story check belongs (plan §16 Phase 10a):
      # AFTER the `migrate` job's gated bootstrap step and BEFORE `promote`, against a revision
      # still at 0% traffic. PORTFOLIO_DEMO_SMOKE_ENABLED is driven by the SAME repo variable
      # that gates the bootstrap, so a deployment carrying no demo runs only the generic ops
      # probes, while one that does bootstrap the story must match config/portfolio-demo.yaml or
      # it never takes traffic. A persona token that failed to mint FAILS the story's
      # authenticated assertions rather than skipping them.
      #
      # `--no-cov`: the suite drives a REMOTE process, so the repo-wide --cov-fail-under=90 in
      # `addopts` cannot apply to it. Coverage is enforced by the `quality` job's real suite.
      - name: Smoke the staged revision (/healthz, /readyz, pytest -m smoke)
        env:
          SMOKE_BASE_URL: ${{ needs.stage.outputs.revision_fqdn }}
          PORTFOLIO_DEMO_SMOKE_ENABLED: ${{ vars.PORTFOLIO_DEMO_BOOTSTRAP_ENABLED }}
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 10 "$SMOKE_BASE_URL/healthz"
          curl -fsS --retry 5 --retry-delay 10 "$SMOKE_BASE_URL/readyz"
          uv sync --all-packages
          uv run pytest -m smoke --no-cov
      # The redaction pipeline is defence in depth that nothing else proves ran in production.
      # Values are read from the environment by NAME, and a finding reports the category or the
      # variable name only — printing the match would turn this gate into the leak it looks for.
      - name: Refuse secret, JWT, PHI, or stack-trace leakage in the revision log
        run: |
          set -euo pipefail
          az containerapp logs show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --revision "${APP_NAME}--${REVISION_SUFFIX}" --tail 500 --output tsv > revision.log
          uv run python scripts/check_log_leakage.py revision.log \
            --secret-env DATABASE_URL \
            --secret-env SUPABASE_SERVICE_ROLE_KEY \
            --secret-env OPENROUTER_API_KEY

  # Promote: smoke passed -> shift 100% traffic to the new revision (zero-downtime).
  promote:
    needs: smoke
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Shift 100% traffic to the new revision
        run: |
          set -euo pipefail
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i…"; sleep $((i*10)); done; return 1; }
          retry az containerapp ingress traffic set -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --revision-weight "${APP_NAME}--${REVISION_SUFFIX}=100"
      # The STABLE ingress FQDN — the one that survives every promotion (D1). It is printed here
      # so the value pasted into AZURE_API_ORIGIN / BACKEND_URL can never be a revision FQDN,
      # which would break the recruiter-facing URL on the very next deploy.
      - name: Report the stable ingress FQDN for AZURE_API_ORIGIN / BACKEND_URL
        run: |
          set -euo pipefail
          fqdn=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "stable ingress origin: https://${fqdn}"
          echo "### Stable ingress origin: \`https://${fqdn}\`" >> "$GITHUB_STEP_SUMMARY"

  # Auto-abort: any failure between staging and promotion -> deactivate the staged revision; the
  # PREVIOUS revision keeps serving 100% (it was never shifted). A broken version never goes live.
  abort:
    needs: [stage, migrate, smoke]
    if: ${{ always() && vars.AZURE_DEPLOY_ENABLED == 'true' && needs.stage.result == 'success' && (needs.migrate.result == 'failure' || needs.smoke.result == 'failure') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deactivate the staged revision (previous revision stays at 100%)
        run: |
          set -euo pipefail
          echo "::error::smoke/migration failed — aborting; previous revision keeps 100% traffic"
          az containerapp revision deactivate -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --revision "${APP_NAME}--${REVISION_SUFFIX}" || true
