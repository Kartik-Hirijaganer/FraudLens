# Frontend deploy (plan §15.7 / Phase 14) — WIRED BUT INERT until Vercel exists (gated on
# VERCEL_DEPLOY_ENABLED). Deploys run only from `dev` / `release/*` after CI succeeds. The Vercel
# token is fetched short-lived from Infisical via GitHub Actions OIDC, masked, and never persisted.
# Vercel deploys are already atomic with instant rollback (see docs/runbooks/deploy-rollback.md).
# Flow: verify -> build (HTTPS API + real-auth portfolio demo baked in) -> deploy -> smoke.
name: deploy-frontend

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches:
      - dev
      - "release/*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    uses: ./.github/workflows/_ci-reusable.yml

  deploy:
    needs: verify
    if: ${{ vars.VERCEL_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Fetch Vercel token from Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_GITHUB_ACTIONS_IDENTITY_ID }}
          oidc-audience: https://github.com/Kartik-Hirijaganer
          domain: https://app.infisical.com
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /ci/vercel
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Deploy to Vercel (prod)
        working-directory: frontend
        env:
          # The SPA calls ONLY the gateway base URL, over HTTPS — sourced from config, never
          # hardcoded. The explicit demo gate exposes public synthetic personas in production;
          # it never enables the dev bypass, and every login still resolves through Supabase /me.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_DEMO_AUTH_ENABLED: "true"
        run: |
          set -euo pipefail
          case "$VITE_API_BASE_URL" in
            https://*) ;;
            *) echo "VITE_API_BASE_URL must be an https:// URL"; exit 1 ;;
          esac
          npm i -g vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Smoke-test the deployed site
        run: curl -fsS --retry 5 --retry-delay 10 "${{ vars.FRONTEND_URL }}" > /dev/null
