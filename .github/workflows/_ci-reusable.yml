# Reusable CI workflow — the SINGLE definition of the gate, invoked by ci.yml,
# dependency-update.yml, and the deploy workflows. It runs the SAME `make` targets
# as the local pre-PR gate, so "if CI passes, deploy won't fail" is structural.
name: _ci-reusable

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for changed-file (diff) coverage
      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (uv workspace + npm ci)
        run: make install
      - name: Run ${{ matrix.stack }} CI gate
        run: make ${{ matrix.stack }}-ci
      - name: Upload coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.stack }}
          path: |
            htmlcov/
            frontend/coverage/
          if-no-files-found: ignore
          retention-days: 7

  quality:
    # Cross-cutting checks that `make ci` includes but the per-stack jobs above do not:
    # SUMMARY headers, physical-line ratchet, docs links, experiment budget/ledger, secret scan,
    # generated-doc freshness, duplication, LLM catalog, portable vLLM harness coverage,
    # and the portfolio-demo literal guard
    # (values derived from config/portfolio-demo.yaml must appear nowhere else). Lives here so
    # every caller (PR, Renovate, release, deploy) enforces them.
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks + git-aware checks want history
      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install Python deps (uv workspace)
        run: uv sync --all-packages
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL "$url" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Cross-cutting quality and governance checks
        run: make header-check file-length-check docs-links-check experiment-budget-check secrets-scan dup-check docs-check llm-catalog-check tenancy-check demo-literals-check quality-gates fulldata-test vllm-bench-test vllm-bench-validate runpod-gpu-test

  durable-postgres:
    name: durable-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fraudlens
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: fraudlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraudlens -d fraudlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://fraudlens:changeme@localhost:5432/fraudlens
      POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://fraudlens:changeme@localhost:5432/fraudlens
    steps:
      - uses: actions/checkout@v5
      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --all-packages
      - name: Apply migrations and run durable PostgreSQL gate
        run: make db-migrate postgres-run-test

  k8s-validate:
    name: k8s-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up pinned kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.32.8
      - name: Install pinned kubeconform
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          curl -sSfL \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            -o "$archive"
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  $archive" \
            | sha256sum --check
          sudo tar -xzf "$archive" -C /usr/local/bin kubeconform
          kubeconform -v
      - name: Install Python dependencies
        run: uv sync --all-packages
      - name: Validate Kubernetes manifests and harness
        run: make k8s-validate k8s-demo-test

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build backend image (no push)
        run: make docker-build

  tf-validate:
    # Terraform fmt -check + validate per environment (plan §15.6 / Phase 14). No apply runs until
    # the Azure account exists; the internal service-split module validates but stays inert in v1.
    name: tf-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Set up uv for Checkov
        uses: astral-sh/setup-uv@v7
      - name: Terraform fmt-check + validate (all roots)
        run: make tf-validate
      - name: Scan ephemeral experiment IaC
        run: make iac-scan

  deps-audit:
    # Dependency vulnerability gate (plan §16 Phase 13): pip-audit over the resolved Python
    # tree + npm audit over the production frontend deps. Separate job (not in the offline
    # `make ci` umbrella) because both query live advisory databases and need network.
    name: deps-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (uv workspace + npm ci)
        run: make install
      - name: Dependency vulnerability audit (pip-audit + npm audit)
        run: make deps-audit
