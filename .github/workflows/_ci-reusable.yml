# Reusable CI workflow — the SINGLE definition of the gate, invoked by ci.yml,
# dependency-update.yml, and the deploy workflows. It runs the SAME `make` targets
# as the local pre-PR gate, so "if CI passes, deploy won't fail" is structural.
name: _ci-reusable

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for changed-file (diff) coverage
      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (uv workspace + npm ci)
        run: make install
      - name: Run ${{ matrix.stack }} CI gate
        run: make ${{ matrix.stack }}-ci
      - name: Upload coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.stack }}
          path: |
            htmlcov/
            frontend/coverage/
          if-no-files-found: ignore
          retention-days: 7

  quality:
    # Cross-cutting checks that `make ci` includes but the per-stack jobs above do not:
    # SUMMARY headers, secret scan, generated-doc freshness, duplication, LLM catalog, and the
    # portfolio-demo literal guard (values derived from config/portfolio-demo.yaml must appear
    # nowhere else). Lives here so every caller (PR, Renovate, release, deploy) enforces them.
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks + git-aware checks want history
      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps (uv workspace)
        run: uv sync --all-packages
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL "$url" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Cross-cutting checks (headers, secrets, docs, duplication, LLM catalog, tenancy, demo literals)
        run: make header-check secrets-scan dup-check docs-check llm-catalog-check tenancy-check demo-literals-check

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image (no push)
        run: make docker-build

  tf-validate:
    # Terraform fmt -check + validate per environment (plan §15.6 / Phase 14). No apply runs until
    # the Azure account exists; the internal service-split module validates but stays inert in v1.
    name: tf-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform fmt -check + validate (dev + prod)
        run: make tf-validate

  deps-audit:
    # Dependency vulnerability gate (plan §16 Phase 13): pip-audit over the resolved Python
    # tree + npm audit over the production frontend deps. Separate job (not in the offline
    # `make ci` umbrella) because both query live advisory databases and need network.
    name: deps-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (uv workspace + npm ci)
        run: make install
      - name: Dependency vulnerability audit (pip-audit + npm audit)
        run: make deps-audit
