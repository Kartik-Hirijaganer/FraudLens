# Auto-fill the PR description with a minimal "which areas changed" summary (backend,
# frontend, LLM, libraries, infra, …) on open/update. Only the PR-SUMMARY:auto region of
# the body is touched — any prose the author writes elsewhere is preserved. This is a
# convenience, NOT a required check: it never blocks a merge.
name: pr-autofill

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write # edit the PR body

concurrency:
  group: pr-autofill-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  summary:
    # Same-repo PRs only — PRs from forks get a read-only token and cannot edit the body.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the base commit present for the diff
      - name: Build the new PR body (areas changed vs base)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > .pr_body_current.md
          python3 scripts/pr_summary.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --body-file .pr_body_current.md > .pr_body_new.md
      - name: Apply it to the PR description
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --body-file .pr_body_new.md
