# Release — on a `v*` tag: re-verify the gate (a tag only ships from CI-green code,
# rule 9), generate the CHANGELOG with git-cliff, and publish a GitHub release.
#
# Publishing is all this workflow does. It deliberately triggers no deploy: deploy-backend.yml
# and deploy-frontend.yml are dispatch-only and gated by `environment: production`, so a tag —
# like a push — never ships code to Azure or Vercel without a human approving that run.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/_ci-reusable.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Generate changelog (git-cliff)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
