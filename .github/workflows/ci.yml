# CI — runs on every human PR and on pushes to protected long-lived branches. Renovate
# PRs are handled by dependency-update.yml, which calls the SAME reusable workflow with the
# SAME caller job id (`ci`), so the required status-check names match either way:
#   ci / backend   ·   ci / frontend   ·   ci / docker-build
name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - "release/*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Skip Renovate branches here; dependency-update.yml runs the identical gate for them.
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    uses: ./.github/workflows/_ci-reusable.yml

  # NOTE: the PR-title Conventional-Commits check lives in commitlint.yml (separate so it
  # also re-runs on title edits). The check context is still `commitlint`.

  # Changed-files gate: per-file lint/format + diff-coverage scoped to the PR's diff
  # vs its base SHA. Complements (does not replace) the repo-wide `ci / *` jobs:
  # type-check + the full test suite stay whole-repo there, since a change can break a
  # file that imports it. Runs on every PR (human and Renovate) so it is always reportable.
  changed:
    name: changed
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the base commit present for the diff
      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (uv workspace + npm ci)
        run: make install
      - name: Changed-files gate (lint + format + diff-coverage vs base)
        run: make ci-changed BASE_REF=${{ github.event.pull_request.base.sha }}
