apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - infisical/backend-secrets.yaml
  - infisical/llm-secrets.yaml
configMapGenerator:
  - name: fraudlens-backend-config
    behavior: merge
    envs:
      - aks-demo.env
images:
  - name: fraudlens-backend
    newName: ghcr.io/kartik-hirijaganer/fraudlens-backend
    newTag: sha-placeholder
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          secrets.infisical.com/auto-reload: "true"
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: kubernetes.azure.com/scalesetpriority
            operator: Equal
            value: spot
            effect: NoSchedule
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.azure.com/scalesetpriority
                      operator: In
                      values: ["spot"]
