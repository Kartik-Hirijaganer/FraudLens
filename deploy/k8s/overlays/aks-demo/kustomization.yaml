apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fraudlens
resources:
  - ../../base
  - infisical/backend-secrets.yaml
  - infisical/llm-secrets.yaml
configMapGenerator:
  - name: fraudlens-backend-config
    behavior: merge
    envs:
      - aks-demo.env
images:
  - name: fraudlens-backend
    newName: ghcr.io/kartik-hirijaganer/fraudlens-backend
    newTag: sha-placeholder
patches:
  # The user pool runs on regular (on-demand) nodes, so there is no scalesetpriority taint to
  # tolerate and no Spot label to prefer; keeping either would steer scheduling for nothing (D2).
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          secrets.infisical.com/auto-reload: "true"
  # The durability proof measures leases and exactly-once recovery, not external model uptime.
  # Keep the API's production-mode readiness probe live while making only the worker deterministic.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: fraudlens-worker
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: FRAUDLENS_LLM_MODE
            value: mock
  - path: service-lb.yaml
  # The base policy admits only in-cluster sources. externalTrafficPolicy: Local preserves the
  # client source IP through DNAT, so Internet traffic matches no namespaceSelector and Cilium
  # drops it — publishing the Service without this rule yields a load balancer that never answers.
  # Appended rather than replacing the list, so the in-cluster rule stays in force. AKS-only: the
  # base and the kind overlay keep a ClusterIP Service with no external path to admit.
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: api-ingress
    patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - ipBlock:
                cidr: 0.0.0.0/0
          ports:
            - protocol: TCP
              port: 8000
