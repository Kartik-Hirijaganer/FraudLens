apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: fraudlens-llm-secrets
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  instantUpdates: false
  authentication:
    azureAuth:
      identityId: replace-infisical-identity-id
      secretsScope:
        projectSlug: replace-infisical-project-slug
        envSlug: prod
        secretsPath: /llm
        recursive: false
  managedKubeSecretReferences:
    - secretName: fraudlens-llm-secrets
      secretNamespace: fraudlens
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY.Value }}"
