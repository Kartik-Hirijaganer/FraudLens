apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: fraudlens-backend-secrets
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  instantUpdates: false
  authentication:
    azureAuth:
      identityId: replace-infisical-identity-id
      secretsScope:
        projectSlug: replace-infisical-project-slug
        envSlug: prod
        secretsPath: /
        recursive: false
  managedKubeSecretReferences:
    - secretName: fraudlens-backend-secrets
      secretNamespace: fraudlens
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          DATABASE_URL: "{{ .DATABASE_URL.Value }}"
          SUPABASE_SERVICE_ROLE_KEY: "{{ .SUPABASE_SERVICE_ROLE_KEY.Value }}"
          FRAUDLENS_DEMO_AUTH_PASSWORD: "{{ .FRAUDLENS_DEMO_AUTH_PASSWORD.Value }}"
          FRAUDLENS_AUTH_JWKS_URL: "{{ .SUPABASE_URL.Value }}/auth/v1/.well-known/jwks.json"
          FRAUDLENS_AUTH_JWT_ISSUER: "{{ .SUPABASE_URL.Value }}/auth/v1"
