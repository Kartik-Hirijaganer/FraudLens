apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: fraudlens-backend-secrets
spec:
  hostAPI: https://app.infisical.com/api
  syncConfig:
    resyncInterval: 60s
    instantUpdates: false
  authentication:
    azureAuth:
      identityId: replace-at-deploy
      azureManagedIdentityClientId: replace-at-deploy
      secretsScope:
        projectSlug: fraudlens
        envSlug: prod
        secretsPath: /backend
        recursive: true
  managedKubeSecretReferences:
    - secretName: fraudlens-backend-secrets
      secretNamespace: fraudlens
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          DATABASE_URL: "{{ .DATABASE_URL.Value }}"
          SUPABASE_SERVICE_ROLE_KEY: "{{ .SUPABASE_SERVICE_ROLE_KEY.Value }}"
          FRAUDLENS_AUTH_JWKS_URL: "{{ .FRAUDLENS_AUTH_JWKS_URL.Value }}"
          FRAUDLENS_AUTH_JWT_ISSUER: "{{ .FRAUDLENS_AUTH_JWT_ISSUER.Value }}"
