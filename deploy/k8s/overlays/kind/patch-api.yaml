apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraudlens-api
spec:
  template:
    spec:
      initContainers:
        - name: seed-rag-index
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: api
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
