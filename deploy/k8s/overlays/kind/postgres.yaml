apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: fraudlens
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fraudlens
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraudlens
        app.kubernetes.io/component: postgres
    spec:
      serviceAccountName: fraudlens-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: postgres-identity
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - cp /etc/passwd /identity/passwd && cp /etc/group /identity/group && printf 'postgres:x:10001:10001:PostgreSQL:/var/lib/postgresql:/bin/sh\n' >> /identity/passwd && printf 'postgres:x:10001:\n' >> /identity/group
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: identity
              mountPath: /identity
      containers:
        - name: postgres
          image: postgres:16.10-bookworm
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: fraudlens
            - name: POSTGRES_USER
              value: fraudlens
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraudlens-kind-postgres
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "fraudlens", "-d", "fraudlens"]
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "fraudlens", "-d", "fraudlens"]
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fraudlens", "-d", "fraudlens"]
            periodSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-run
              mountPath: /var/run/postgresql
            - name: temporary
              mountPath: /tmp
            - name: identity
              mountPath: /etc/passwd
              subPath: passwd
              readOnly: true
            - name: identity
              mountPath: /etc/group
              subPath: group
              readOnly: true
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: postgres-run
          emptyDir: {}
        - name: temporary
          emptyDir: {}
        - name: identity
          emptyDir: {}
