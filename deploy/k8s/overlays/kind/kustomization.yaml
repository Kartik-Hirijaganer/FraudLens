apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - postgres.yaml
  - bootstrap-job.yaml
configMapGenerator:
  - name: fraudlens-backend-config
    behavior: merge
    envs:
      - kind.env
secretGenerator:
  - name: fraudlens-backend-secrets
    literals:
      # Synthetic, kind-only credential. It is intentionally allowlisted by .gitleaks.toml.
      - DATABASE_URL=postgresql+asyncpg://fraudlens:changeme@postgres:5432/fraudlens
  - name: fraudlens-kind-postgres
    literals:
      - POSTGRES_PASSWORD=changeme
images:
  - name: fraudlens-backend
    newName: fraudlens-backend
    newTag: local
patches:
  - path: patch-api.yaml
  - path: patch-worker.yaml
