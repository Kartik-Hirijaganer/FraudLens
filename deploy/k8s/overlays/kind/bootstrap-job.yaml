apiVersion: batch/v1
kind: Job
metadata:
  name: fraudlens-bootstrap
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraudlens
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: fraudlens-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: fraudlens-backend:local
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - until python -c "import asyncio,asyncpg,os; asyncio.run(asyncpg.connect(os.environ['DATABASE_URL'].replace('postgresql+asyncpg://','postgresql://')))"; do sleep 2; done
          envFrom:
            - secretRef:
                name: fraudlens-backend-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      containers:
        - name: bootstrap
          image: fraudlens-backend:local
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - python -m alembic upgrade head && python scripts/seed.py
          envFrom:
            - configMapRef:
                name: fraudlens-backend-config
            - secretRef:
                name: fraudlens-backend-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir: {}
