apiVersion: batch/v1
kind: Job
metadata:
  name: fraudlens-load
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraudlens
        app.kubernetes.io/component: load
    spec:
      restartPolicy: Never
      serviceAccountName: fraudlens-runtime
      automountServiceAccountToken: false
      nodeSelector:
        fraudlens.io/workload: application
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: fraudlens
                  app.kubernetes.io/component: api
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: load
          image: fraudlens-backend:local
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/k8s_demo.py", "load-in-cluster"]
          envFrom:
            - configMapRef:
                name: fraudlens-load-config
          env:
            - name: K8S_DEMO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fraudlens-load-auth
                  key: token
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir: {}
