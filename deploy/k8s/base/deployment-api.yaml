apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraudlens-api
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: fraudlens
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraudlens
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: fraudlens-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fraudlens
              app.kubernetes.io/component: api
      initContainers:
        - name: seed-rag-index
          image: fraudlens-backend:local
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - mkdir -p /app/.local/chroma && cp -R /app/rag-index/. /app/.local/chroma/
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: local-state
              mountPath: /app/.local
            - name: temporary
              mountPath: /tmp
      containers:
        - name: api
          image: fraudlens-backend:local
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fraudlens-backend-config
            - secretRef:
                name: fraudlens-backend-secrets
                optional: true
            - secretRef:
                name: fraudlens-llm-secrets
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: local-state
              mountPath: /app/.local
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: local-state
          emptyDir: {}
        - name: temporary
          emptyDir: {}
