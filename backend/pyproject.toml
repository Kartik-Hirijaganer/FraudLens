# fraudlens-backend — the FastAPI service (uv workspace member).
# Layering: may import both fraudlens-core and fraudlens-ml. No [tool.ruff]
# section here on purpose — backend files inherit the workspace-root ruff config.

[project]
name = "fraudlens-backend"
version = "0.1.0"
description = "FraudLens FastAPI service (walking skeleton)."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kartik Hirijaganer" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "fraudlens-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudlens_backend"]

[tool.uv.sources]
fraudlens-core = { workspace = true }
